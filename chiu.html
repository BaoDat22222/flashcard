<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flashcard Premium ♥️🇻🇳 · Tự luyện tập</title>
  <meta name="description" content="Flashcard Premium - Tự luyện tập">
  <style>
    /* Page background + keep original login markup & behavior */
    :root{--accent1:#0adcb4;--accent2:#1478e0}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial}
    body{
      display:flex;align-items:center;justify-content:center;min-height:100vh;
      /* only change wallpaper here; keep rest of layout & scripts untouched */
      background:
        linear-gradient(180deg, rgba(6,18,41,0.45), rgba(10,60,80,0.35)),
        url('assets/bg.jpg') center/cover no-repeat;
      color:#fff;
    }
    .card{width:380px;max-width:94%;padding:28px;border-radius:14px;background:rgba(255,255,255,0.08);backdrop-filter:blur(8px);box-shadow:0 12px 40px rgba(2,6,23,0.6);border:1px solid rgba(255,255,255,0.08)}
    .brand{text-align:center;margin-bottom:8px}
    .brand h1{margin:0;font-size:20px;letter-spacing:0.3px}
    .brand p{margin:6px 0 0;font-size:13px;opacity:.9}
    label{display:block;font-size:13px;margin-bottom:6px;opacity:.95}
    .field{margin-top:12px;position:relative}
    input[type="text"],input[type="password"]{width:100%;padding:12px 44px 12px 12px;border-radius:10px;border:none;background:rgba(255,255,255,0.06);color:#fff;font-size:15px}
    input:focus{outline:none;box-shadow:0 8px 30px rgba(0,0,0,0.4);}
    .toggle-pass{position:absolute;right:8px;top:36px;background:transparent;border:none;color:rgba(255,255,255,0.95);width:36px;height:36px;border-radius:8px;cursor:pointer}
    .btn{margin-top:16px;width:100%;padding:12px;border-radius:10px;border:none;font-weight:700;font-size:15px;cursor:pointer;background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#04202b}
    .hint{margin-top:8px;font-size:13px;opacity:.9}
    @media (max-width:420px){.card{padding:20px}}
  </style>
</head>
<body>
  <div class="card" role="region" aria-label="Login card">
    <div class="brand">
      <h1>Flashcard · Đăng nhập</h1>
      <p>Ôn và học mọi lúc — giản lược, nhanh chóng</p>
    </div>

    <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
      <div class="field">
        <label for="username">Tên đăng nhập</label>
        <input id="username" name="username" type="text" autocomplete="username" placeholder="Nhập tên đăng nhập" required>
      </div>

      <div class="field">
        <label for="password">Mật khẩu</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" minlength="6" required aria-describedby="pass-hint">
        <button type="button" class="toggle-pass" aria-label="Hiện mật khẩu" title="Hiện/Ẩn mật khẩu" onclick="togglePassword()">
          <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:rgba(255,255,255,0.95)">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
        <div id="pass-hint" class="hint">Mật khẩu tối thiểu 6 ký tự.</div>
      </div>

      <button class="btn" type="submit">Đăng nhập</button>
    </form>
  </div>

  <script>
    function togglePassword(){
      const input=document.getElementById('password');const eye=document.getElementById('eyeIcon');
      if(input.type==='password'){input.type='text';eye.innerHTML='<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.83 20.83 0 0 1 5.31-6.12"></path><path d="M1 1l22 22"></path>';}else{input.type='password';eye.innerHTML='<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"></path><circle cx="12" cy="12" r="3"></circle>'}
    }
    function handleLogin(){
      const u=document.getElementById('username').value.trim();const p=document.getElementById('password').value;
      if(!u||p.length<6){alert('Vui lòng nhập đầy đủ. Mật khẩu phải có ít nhất 6 ký tự.');return}
      // Placeholder: replace with your server auth call
      console.log('Login attempt',u);
      alert('Đăng nhập đã được kích hoạt (thêm xử lý phía server).');
    }
  </script>
</body>
</html>
