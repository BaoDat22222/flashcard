<html lang="en" style="--card-front: #0f172a; --card-front2: #7c3aed; --card-back: #b45309; --card-back2: #dc2626; --face-emoji: &quot;📖&quot;;"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Premium ♥️🇻🇳 · Tự luyện tập</title>
    <link rel="preconnect" href="https://fonts.googleapis.com/">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
    <link href="./chiu_files/css2" rel="stylesheet">
    <style>
        /* ============================================================
           GƯƠNG MIỆNG · FLASHCARD PREMIUM
           A completely fresh visual identity - mirror-glass, aurora ink.
           Everything you see here is new. The learning engine + the
           exact 1391-word library are preserved from the original.
           ============================================================ */

        /* ===== RESET & BASE ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            scroll-behavior: smooth;
        }
        :root {
            --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
            --ease-smooth: cubic-bezier(.22, 1, .36, 1);
            --ease-out: cubic-bezier(.16, 1, .3, 1);

            --bg1: #f7f3ee;
            --bg2: #efdfd3;
            --bg3: #e8ecf4;
            --ink: #241b2e;
            --muted: #77687f;
            --card-bg: rgba(255, 255, 255, .74);
            --line: rgba(50, 30, 60, .12);
            --accent: #c44569;
            --accent2: #f0a864;
            --accent3: #6d5bd0;
            --good: #0f9d7b;
            --bad: #d64550;
            --shadow: 0 18px 40px -18px rgba(60, 30, 70, .35);
            --glass: rgba(255, 255, 255, .55);
            --glow: rgba(196, 69, 105, .28);
        }
        body {
            font-family: 'Outfit', 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            padding: 20px;
            /* Updated background only: prettier gradient while preserving layout */
            background:
                radial-gradient(900px 400px at 10% 10%, rgba(124,58,237,0.12), transparent 30%),
                radial-gradient(800px 380px at 90% 80%, rgba(196,69,105,0.10), transparent 30%),
                linear-gradient(120deg, #0f172a 0%, #0b3b62 40%, #075985 70%, #0a6b5f 100%);
            color: var(--ink);
            transition: background .5s ease, color .4s ease;
            background-attachment: fixed;
        }
        .wrap {
            max-width: 820px;
            margin: 0 auto;
        }
        @media (min-width:1000px) {
            .wrap {
                max-width: 1180px;
            }
            .wrap:has(#page-study.active) {
                max-width: 1040px;
            }
            .wrap:has(#page-practice.active) {
                max-width: 1040px;
            }
        }

        /* ===== PAGES ===== */
        .page {
            display: none;
            animation: pageIn .5s cubic-bezier(.22, 1, .36, 1) both;
        }
        .page.active {
            display: block;
        }
        @keyframes pageIn {
            from {
                opacity: 0;
                transform: translateY(14px) scale(.99);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* GPU-friendly surfaces */
        .card,
        .card-stage,
        .page.active,
        .toast,
        .progress-fill,
        .btn,
        .lp-btn-primary,
        .lp-btn-ghost,
        .lp-enter,
        .tab-btn,
        .lp-tool-card,
        .lp-feature-card,
        .lp-coll-card,
        .dash-tool-btn,
        .folder-card,
        .opt,
        .mode-btn {
            transform: translateZ(0);
            backface-visibility: hidden;
        }
        .card-stage,
        .page {
            contain: layout paint;
        }

        /* ===== HEADER ===== */
        header {
            text-align: center;
            margin-bottom: 18px;
        }
        header h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 800;
            font-size: clamp(1.5rem, 3vw, 2.1rem);
            letter-spacing: -.02em;
            background: linear-gradient(120deg, var(--accent), var(--accent3));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        header p {
            color: var(--muted);
            font-size: .85rem;
            letter-spacing: .04em;
            margin-top: 4px;
        }

        /* ===== SETTINGS FAB ===== */
        .settings-fab {
            position: fixed;
            bottom: 22px;
            right: 22px;
            z-index: 90;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, .55);
            background: linear-gradient(135deg, var(--accent), var(--accent3));
            color: #fff;
            font-size: 1.35rem;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: transform .25s var(--ease-spring), box-shadow .25s;
        }
        .settings-fab:hover {
            transform: rotate(18deg) scale(1.08);
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translate(-50%, -16px);
            background: rgba(36, 27, 46, .92);
            color: #fff;
            padding: 12px 20px;
            border-radius: 999px;
            font-size: .9rem;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s, transform .3s var(--ease-spring);
            border: 1px solid rgba(255, 255, 255, .18);
            box-shadow: 0 14px 34px -12px rgba(0, 0, 0, .45);
        }
        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* ===== SETTINGS MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(20, 12, 26, .55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 150;
            padding: 20px;
            transition: opacity .3s;
        }
        .modal-overlay.hidden {
            display: none;
        }
        .settings-card {
            width: 100%;
            max-width: 560px;
            background: var(--card-bg);
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 28px;
            position: relative;
            box-shadow: var(--shadow);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            max-height: 90vh;
            overflow-y: auto;
        }
        .p-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, .5);
            color: var(--ink);
            font-size: 1rem;
            cursor: pointer;
            transition: transform .2s var(--ease-spring);
        }
        .p-close:hover {
            transform: rotate(90deg);
        }
        .settings-card h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            margin-bottom: 4px;
        }
        .settings-card>p {
            color: var(--muted);
            font-size: .9rem;
            margin-bottom: 20px;
        }
        .settings-section {
            margin-bottom: 20px;
        }
        .settings-label {
            font-weight: 600;
            font-size: .9rem;
            margin-bottom: 10px;
            color: var(--ink);
        }
        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .settings-row .settings-label {
            margin-bottom: 0;
        }
        .settings-select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, .6);
            color: var(--ink);
            font-size: .9rem;
            font-family: inherit;
        }
        .settings-hint {
            font-size: .78rem;
            color: var(--muted);
            margin-top: 8px;
        }

        .switch {
            width: 48px;
            height: 27px;
            border-radius: 999px;
            border: none;
            background: rgba(120, 100, 130, .35);
            position: relative;
            cursor: pointer;
            transition: background .3s;
            flex-shrink: 0;
        }
        .switch .switch-knob {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 21px;
            height: 21px;
            border-radius: 50%;
            background: #fff;
            transition: left .3s var(--ease-spring);
            box-shadow: 0 2px 6px rgba(0, 0, 0, .25);
        }
        .switch.on {
            background: linear-gradient(90deg, var(--accent), var(--accent3));
        }
        .switch.on .switch-knob {
            left: 24px;
        }

        .theme-picker {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }
        .theme-opt {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 10px 6px;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, .5);
            color: var(--muted);
            font-size: .62rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform .2s var(--ease-spring), border-color .2s, color .2s;
        }
        .theme-opt:hover {
            transform: translateY(-2px);
        }
        .theme-opt.active {
            border-color: var(--accent);
            color: var(--ink);
            box-shadow: 0 0 0 3px var(--glow);
        }
        .theme-swatch {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, .65);
            box-shadow: inset 0 0 6px rgba(0, 0, 0, .12);
        }
        .swatch-rustic {
            background: linear-gradient(135deg, #f5d9a8, #c98e5c);
        }
        .swatch-modern {
            background: linear-gradient(135deg, #e8ecf4, #7f8fa6);
        }
        .swatch-ocean {
            background: linear-gradient(135deg, #7fd3f2, #16659a);
        }
        .swatch-forest {
            background: linear-gradient(135deg, #9ccf8f, #2d6a4f);
        }
        .swatch-cosmic {
            background: linear-gradient(135deg, #c9a8f0, #5b2c9e);
        }

        .acc-row {
            display: flex;
            gap: 10px;
        }
        .acc-pill {
            padding: 9px 16px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, .5);
            font-size: .85rem;
            cursor: pointer;
            transition: all .25s;
        }
        .acc-pill.active {
            background: linear-gradient(135deg, var(--accent), var(--accent3));
            color: #fff;
            border-color: transparent;
        }

        /* ============================================================
           DYNAMIC-ISLAND TIMER HUB
           ============================================================ */
        .timer-island {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 120;
            width: min(420px, 92vw);
        }
        .island-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 auto;
            padding: 8px 18px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, .4);
            background: rgba(36, 27, 46, .9);
            color: #fff;
            font-size: .9rem;
            cursor: pointer;
            box-shadow: 0 12px 30px -12px rgba(0, 0, 0, .5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: transform .25s var(--ease-spring);
        }
        .island-pill:hover {
            transform: translateY(2px);
        }
        .island-pill-clock {
            opacity: .6;
            font-feature-settings: "tnum";
        }
        .island-pill-time {
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            color: var(--accent2);
        }

        .island-panel {
            margin-top: 10px;
            border-radius: 26px;
            background: var(--card-bg);
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            overflow: hidden;
            display: none;
        }
        .timer-island.expanded .island-panel {
            display: block;
            animation: islandIn .35s var(--ease-spring);
        }
        @keyframes islandIn {
            from {
                opacity: 0;
                transform: translateY(-8px) scale(.97);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }
        .timer-container {
            padding: 20px;
            position: relative;
        }
        .island-close {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, .5);
            color: var(--ink);
            font-size: .9rem;
            cursor: pointer;
        }
        .island-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .island-header-title {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 1.15rem;
        }
        .island-header-clock {
            font-size: .75rem;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }
        .island-tabs {
            display: flex;
            gap: 6px;
            background: rgba(120, 90, 130, .12);
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 18px;
        }
        .island-tab {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 11px;
            background: transparent;
            color: var(--muted);
            font-size: .82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all .25s;
        }
        .island-tab.active {
            background: var(--glass);
            color: var(--ink);
            box-shadow: 0 4px 12px -4px rgba(0, 0, 0, .18);
        }
        .timer-sub {
            font-size: .78rem;
            color: var(--muted);
        }

        .timer-clock {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 18px 0 10px;
        }
        .timer-box {
            background: rgba(20, 12, 26, .92);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 18px;
            padding: 12px 16px;
            min-width: 76px;
            text-align: center;
        }
        .timer-val {
            font-size: 1.9rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: .02em;
        }
        .timer-label {
            font-size: .62rem;
            opacity: .6;
            letter-spacing: .08em;
            text-transform: uppercase;
        }
        .timer-sep {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--muted);
        }
        .timer-status {
            text-align: center;
            font-size: .85rem;
            margin-bottom: 14px;
        }

        .timer-modes {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-bottom: 14px;
        }
        .mode-btn {
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, .5);
            color: var(--muted);
            font-size: .8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all .25s;
        }
        .mode-btn.active {
            background: linear-gradient(135deg, var(--accent), var(--accent3));
            color: #fff;
            border-color: transparent;
        }

        .timer-custom-input {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            justify-content: center;
            margin-bottom: 14px;
        }
        .timer-custom-input label {
            font-size: .78rem;
            color: var(--muted);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .timer-custom-input input {
            width: 72px;
            padding: 8px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, .6);
            color: var(--ink);
            font-size: 1rem;
            font-variant-numeric: tabular-nums;
        }
        .set-btn {
            padding: 10px 16px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, var(--accent), var(--accent3));
            color: #fff;
            font-weight: 600;
            font-size: .85rem;
            cursor: pointer;
        }

        .timer-controls {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 16px;
        }
        .t-btn {
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, .55);
            color: var(--ink);
            font-size: .85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
        }
        .t-btn:hover:not(:disabled) {
            transform: translateY(-2px);
        }
        .t-btn:disabled {
            opacity: .45;
            cursor: not-allowed;
        }
        .t-btn-start {
            background: linear-gradient(135deg, var(--good), #17b987);
            color: #fff;
            border-color: transparent;
        }

        .timer-laps {
            max-height: 120px;
            overflow-y: auto;
            border-top: 1px dashed var(--line);
            padding-top: 10px;
            font-size: .82rem;
        }
        .lap-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 2px;
            font-variant-numeric: tabular-nums;
        }
        .timer-footer {
            font-size: .8rem;
            color: var(--muted);
            text-align: center;
        }
        .timer-footer span {
            color: var(--accent);
        }

        .island-stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .stat-chip {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            border-radius: 14px;
            background: rgba(255, 255, 255, .55);
            border: 1px solid var(--line);
        }
        .stat-emoji {
            font-size: 1.2rem;
        }
        .stat-num {
            font-weight: 700;
            font-size: .95rem;
        }
        .stat-label {
            font-size: .68rem;
            color: var(--muted);
        }
        .goal-ring-wrap {
            flex-shrink: 0;
        }
        .goal-ring-bg {
            fill: none;
            stroke: rgba(120, 100, 130, .25);
            stroke-width: 3.5;
        }
        .goal-ring-fg {
            fill: none;
            stroke: var(--accent);
            stroke-width: 3.5;
            stroke-linecap: round;
            transform: rotate(-90deg);
            transform-origin: center;
            transition: stroke-dashoffset .6s ease;
        }

        .island-quick-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .island-quick-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px;
            border-radius: 16px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, .55);
            color: var(--ink);
            font-size: .86rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform .2s var(--ease-spring), background .2s;
        }
        .island-quick-btn:hover {
            transform: translateY(-2px);
        }
        .island-quick-btn.on {
            background: linear-gradient(135deg, var(--accent), var(--accent3));
            color: #fff;
            border-color: transparent;
        }
        .iq-icon {
            font-size: 1.2rem;
        }

        /* ============================================================
           LANDING PAGE
           ============================================================ */
        #page-landing {
            position: relative;
        }
        #page-landing .lp-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
            padding: 6px 0;
        }
        #page-landing .lp-logo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Playfair Display', serif;
            font-weight: 800;
            font-size: 1.35rem;
            letter-spacing: -.01em;
        }
        #page-landing .lp-logo .lp-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            box-shadow: 0 0 12px var(--glow);
            display: inline-block;
        }
        #page-landing .lp-logo .lp-pro {
            background: linear-gradient(120deg, var(--accent), var(--accent3));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-style: italic;
        }
        #page-landing .lp-enter {
            padding: 10px 20px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--glass);
            color: var(--ink);
            font-weight: 600;
            font-size: .9rem;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: transform .25s var(--ease-spring), box-shadow .25s;
        }
        #page-landing .lp-enter:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        #page-landing .lp-board {
            position: relative;
            border-radius: 30px;
            border: 1px solid var(--line);
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            overflow: hidden;
            box-shadow: var(--shadow);
            padding: clamp(28px, 6vw, 60px);
            margin-bottom: 28px;
            isolation: isolate;
        }
        #page-landing .lp-hero-bg {
            position: absolute;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            background:
                radial-gradient(520px 300px at 12% 8%, rgba(196, 69, 105, .22), transparent 60%),
                radial-gradient(420px 280px at 88% 20%, rgba(109, 91, 208, .22), transparent 60%),
                radial-gradient(380px 260px at 60% 90%, rgba(240, 168, 100, .22), transparent 55%);
        }
        #page-landing .lp-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: .5;
            animation: blobFloat 14s ease-in-out infinite;
        }
        #page-landing .lp-blob-1 {
            width: 260px;
            height: 260px;
            background: var(--accent);
            top: -60px;
            left: -50px;
        }
        #page-landing .lp-blob-2 {
            width: 200px;
            height: 200px;
            background: var(--accent3);
